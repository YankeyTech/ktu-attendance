<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | KTU check-in</title><link rel="stylesheet" href="style.css?v=12"><link rel="stylesheet" href="extra.css?v=12">
<style>main{max-width:1000px}th[data-k]{cursor:pointer;user-select:none}.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.tabs button{flex:1}.tabs .on{background:#004c84;color:#fff}.cred{background:#fff8d6;color:#222;border:1px solid #e0c200;border-radius:10px;padding:12px;margin:10px 0}.cred code{font-size:18px;font-weight:700}</style></head>
<body><main>
  <header class="top"><h1>Admin</h1><p id="who">KTU class check-in</p></header>
  <form id="login" class="card"><h2>Admin sign in</h2>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button><p id="loginMsg" class="msg" role="status"></p></form>
  <div id="app" hidden>
    <div class="tabs"><button class="btn quiet on" data-t="over">Overview</button><button class="btn quiet" data-t="lect">Lecturers</button><button class="btn quiet" data-t="cls">All classes</button><a class="btn quiet" href="teacher.html">Lecturer portal</a><button id="out" class="btn quiet">Sign out</button></div>
    <p id="msg" class="msg" role="status"></p>
    <section id="t-over" class="card"><h2>Overview</h2><div class="stats" id="stats"></div></section>
    <section id="t-lect" class="card" hidden><h2>Lecturers</h2>
      <form id="add" class="bar"><input id="aemail" type="email" placeholder="Lecturer email" required><input id="aname" placeholder="Full name (optional)"><select id="arole"><option value="lecturer">Lecturer</option><option value="assistant">Teaching assistant</option></select><button class="btn" type="submit">Add lecturer</button></form>
      <div id="cred"></div>
      <div id="reqBox" class="reqbox" hidden><h3>Name change requests <span id="reqN" class="badge on"></span></h3><div id="reqList"></div></div>
      <div class="bar"><input id="lq" placeholder="Search lecturers"></div>
      <div class="table-wrap"><table><thead id="lh"></thead><tbody id="lb"></tbody></table></div></section>
    <section id="t-cls" class="card" hidden><h2>All classes</h2>
      <div class="bar"><input id="cq" placeholder="Search course, programme or lecturer"><select id="fc"><option value="">All courses</option></select><select id="fp"><option value="">All programmes</option></select><select id="fl"><option value="">All levels</option></select><select id="fo"><option value="">All staff</option></select><select id="fy"><option value="">All years</option></select><select id="fs"><option value="">All semesters</option></select><select id="ft"><option value="">All types</option><option value="single">Single</option><option value="combined">Combined</option></select></div>
      <div class="bar"><label>From <input id="fd1" type="date"></label><label>To <input id="fd2" type="date"></label><button id="cx" class="btn quiet" type="button">Download Excel (filtered)</button></div>
      <div class="table-wrap"><table><thead id="ch"></thead><tbody id="cb"></tbody></table></div></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="shared.js?v=12"></script>
<script src="config.js"></script><script src="admin.js?v=12"></script></body></html>
