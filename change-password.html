<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set your password | KTU</title><link rel="stylesheet" href="style.css?v=6"><link rel="stylesheet" href="extra.css?v=6"></head>
<body><main>
  <header class="top"><h1>Set your own password</h1><p id="who">KTU class check-in</p></header>
  <form id="f" class="card">
    <p class="note">You signed in with a default password. Choose your own to continue.</p>
    <label for="p1">New password (at least 8 characters)</label>
    <input id="p1" type="password" minlength="8" autocomplete="new-password" required>
    <label for="p2">Repeat new password</label>
    <input id="p2" type="password" minlength="8" autocomplete="new-password" required>
    <button class="btn" type="submit">Save and continue</button>
    <p id="msg" class="msg" role="status"></p>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (i) => document.getElementById(i);
const say = (t, k) => { $("msg").textContent = t; $("msg").className = "msg " + (k || ""); };
sb.auth.getSession().then(({ data: { session } }) => { if (!session) location.replace("teacher.html"); else $("who").textContent = session.user.email; });
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if ($("p1").value !== $("p2").value) return say("The two passwords do not match.", "bad");
  if ($("p1").value.length < 8) return say("Use at least 8 characters.", "bad");
  say("Saving…");
  const { error } = await sb.auth.updateUser({ password: $("p1").value });
  if (error) return say(error.message, "bad");
  const r = await sb.rpc("password_changed");
  if (r.error) return say("Password saved, but the account could not be updated. Tell the admin.", "bad");
  say("Password saved. Opening your portal…", "ok");
  setTimeout(() => location.replace("teacher.html"), 900);
});
</script></body></html>
