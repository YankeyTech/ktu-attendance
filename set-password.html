<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose your password | KTU</title><link rel="stylesheet" href="style.css?v=17"><link rel="stylesheet" href="extra.css?v=17"></head>
<body><main>
  <header class="top"><h1 id="h">Choose your password</h1><p id="who">KTU class check-in</p></header>
  <div id="bad" class="card" hidden>
    <p id="badTxt" class="msg bad"></p>
    <p class="note">Links work once and expire. Go to the sign-in page, click <b>Forgot password?</b> and enter your email to get a new link.</p>
    <a class="btn" href="teacher.html">Go to sign in</a>
  </div>
  <form id="f" class="card" hidden>
    <div id="nmBox" hidden>
      <label for="nm">Your full name</label>
      <input id="nm" maxlength="100" autocomplete="name" placeholder="e.g. Kwame Mensah">
      <p class="note">This is the name that appears on attendance spreadsheets and on the student page.</p>
    </div>
    <label for="p1">New password (at least 8 characters)</label>
    <input id="p1" type="password" minlength="8" autocomplete="new-password" required>
    <label for="p2">Repeat new password</label>
    <input id="p2" type="password" minlength="8" autocomplete="new-password" required>
    <button id="go" class="btn" type="submit">Save password and continue</button>
    <p id="msg" class="msg" role="status"></p>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared.js?v=19"></script>
<script src="config.js"></script>
<script>
// Read the link's details before supabase-js clears them from the address bar.
const hp = new URLSearchParams(location.hash.replace(/^#/, "")), linkType = hp.get("type"), linkError = hp.get("error_description") || hp.get("error");
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (i) => document.getElementById(i);
const say = (t, k) => { $("msg").textContent = t; $("msg").className = "msg " + (k || ""); };
const titleCase = (t) => t.replace(/\S+/g, (w) => w[0].toUpperCase() + w.slice(1).toLowerCase());
let needName = false, role = "lecturer";
function fail(t) { $("f").hidden = true; $("bad").hidden = false; $("badTxt").textContent = t; }
(async () => {
  $("h").textContent = linkType === "invite" ? "Welcome. Choose your password" : "Reset your password";
  if (linkError) return fail(/expired|invalid/i.test(linkError) ? "This link has expired or was already used." : "This link did not work: " + linkError.replace(/\+/g, " "));
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return fail("This link is not valid any more.");
  $("who").textContent = session.user.email;
  const { data: pr } = await sb.from("profiles").select("full_name,role,active").eq("id", session.user.id).single();
  if (pr && pr.active === false) { await sb.auth.signOut(); return fail("This account is disabled. Contact the admin."); }
  role = (pr && pr.role) || "lecturer";
  needName = !(pr && pr.full_name);
  $("nmBox").hidden = !needName; $("nm").required = needName;
  $("f").hidden = false;
})();
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if ($("p1").value !== $("p2").value) return say("The two passwords do not match.", "bad");
  if ($("p1").value.length < 8) return say("Use at least 8 characters.", "bad");
  const name = titleCase($("nm").value.trim().replace(/\s+/g, " "));
  if (needName && name.length < 3) return say("Enter your full name.", "bad");
  $("go").disabled = true; say("Saving…");
  const { error } = await sb.auth.updateUser({ password: $("p1").value });
  if (error) { $("go").disabled = false; return say(error.message, "bad"); }
  if (needName) {
    const nr = await sb.rpc("set_my_name", { p_name: name });
    if (nr.error) say("Password saved, but your name could not be saved: " + nr.error.message, "bad");
  }
  await sb.rpc("password_changed");
  say("Password saved. Opening your portal…", "ok");
  setTimeout(() => location.replace(role === "admin" ? "admin.html" : "teacher.html"), 900);
});
</script></body></html>
